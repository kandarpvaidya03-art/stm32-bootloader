name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Host-side unit tests
        run: make test

      - name: Build bootloader and application
        run: make

      - name: Install Python test dependencies
        run: pip install pyserial cryptography pytest

      - name: Simulator tests (protocol, rollback, power-loss injection)
        run: python -m pytest -q sim/tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build the toolchain image
        run: docker build -t stm32-bootloader .

      - name: Build and test inside the container
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/work stm32-bootloader
